name: FNF Android public source compile probe
on:
  push:
    branches:
      - ci/psych-mobile-probe
    paths:
      - '.github/workflows/meg-am-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout Megamix
        uses: actions/checkout@v4

      - name: Fetch exact public mobile source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ryzen-x7/Psych-Engine-1.0.4-Mobile.git mobile-source
          git -C mobile-source rev-parse HEAD | tee source-commit.txt
          test -f mobile-source/Project.xml
          test -f mobile-source/source/Main.hx

      - name: Setup Haxe 4.3.7
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.7'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup NDK r27c
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-33' 'build-tools;33.0.2' 'platform-tools'
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          java -version
          haxe -version

      - name: Install required Haxe libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib install lime 8.1.2 --always
          haxelib install openfl 9.3.3 --always
          haxelib install flixel 5.6.1 --always
          haxelib install flixel-addons 3.2.2 --always
          haxelib install flixel-tools 1.5.1 --always
          haxelib install hxcpp-debug-server --always
          haxelib install tjson 1.4.0 --always
          haxelib install hscript-iris 1.1.3 --always
          haxelib install hxvlc 2.0.1 --skip-dependencies --always
          haxelib install extension-androidtools 2.2.2 --always
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit 1906c4a96f6bb6df66562b3f24c62f4c5bba14a7
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp.git ceb70d040f0792f004ccf1ed7eb6fcea01d7f3ff
          haxelib list | tee installed-haxelibs.txt

      - name: Configure Lime
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime display -project mobile-source/Project.xml android > lime-display.txt 2>&1 || true

      - name: Fix verified upstream StoryMenuState syntax bug
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile-source/source/states/StoryMenuState.hx')
          data = p.read_text(encoding='utf-8')
          broken = "rightArrow.animation.play('press')"
          fixed = "rightArrow.animation.play('press');"
          if data.count(broken) != 1:
              raise SystemExit('Unexpected mobile source: syntax patch anchor mismatch')
          p.write_text(data.replace(broken, fixed), encoding='utf-8')
          print('StoryMenuState.hx: fixed exactly one missing semicolon')
          PY

      - name: Resolve Android native extension and missing mobile type imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('mobile-source')
          main = root/'source/Main.hx'
          text = main.read_text()
          old = 'import android.content.Context;'
          assert text.count(old) == 1, 'Main Context import changed upstream'
          main.write_text(text.replace(old, 'import extension.androidtools.content.Context;'))
          project = root/'Project.xml'
          text = project.read_text()
          marker = '</project>'
          assert text.count(marker) == 1 and 'extension-androidtools' not in text, 'Project.xml unexpected'
          project.write_text(text.replace(marker, '  <haxelib name="extension-androidtools" if="android" />\n' + marker))
          controls = root/'source/backend/Controls.hx'
          text = controls.read_text()
          marker = 'import flixel.input.keyboard.FlxKey;'
          assert text.count(marker) == 1
          additions = ('\nimport flixel.input.actions.FlxActionInput;'
                       '\nimport flixel.input.actions.FlxAction.FlxActionDigital;'
                       '\nimport flixel.input.actions.FlxActionInputDigital.FlxActionInputDigitalIFlxInput;'
                       '\nimport flixel.input.FlxInput.FlxInputState;'
                       '\nimport mobile.flixel.FlxVirtualPad.FlxDPadMode;'
                       '\nimport mobile.flixel.FlxVirtualPad.FlxActionMode;')
          controls.write_text(text.replace(marker, marker + additions))
          print('Context and missing mobile types patched in temporary source checkout')
          PY

      - name: Rewrite incomplete touch action bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/fix_mobile_controls.py mobile-source

      - name: Compile Android debug APK
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd mobile-source
          haxelib run lime build android -debug > ../android-compile.log 2>&1 || {
            tail -100 ../android-compile.log
            exit 1
          }
          find export -name '*.apk' -type f | tee ../apks-found.txt
          test -s ../apks-found.txt

      - name: Upload compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megamix-android-baseline-logs
          path: |
            source-commit.txt
            installed-haxelibs.txt
            lime-display.txt
            android-compile.log
            apks-found.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK only if freshly compiled
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: megamix-android-baseline-apk
          path: mobile-source/export/**/*.apk
          if-no-files-found: error
          retention-days: 7
