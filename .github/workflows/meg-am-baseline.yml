name: FNF Android public source compile probe
on:
  push:
    branches:
      - ci/psych-mobile-probe
    paths:
      - '.github/workflows/meg-am-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout Megamix
        uses: actions/checkout@v4

      - name: Fetch exact public mobile source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ryzen-x7/Psych-Engine-1.0.4-Mobile.git mobile-source
          git -C mobile-source rev-parse HEAD | tee source-commit.txt
          test -f mobile-source/Project.xml
          test -f mobile-source/source/Main.hx

      - name: Setup Haxe 4.3.7
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.7'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup NDK r27c
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-33' 'build-tools;33.0.2' 'platform-tools'
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          java -version
          haxe -version

      - name: Install required Haxe libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib install lime 8.1.2 --always
          haxelib install openfl 9.3.3 --always
          haxelib install flixel 5.6.1 --always
          haxelib install flixel-addons 3.2.2 --always
          haxelib install flixel-tools 1.5.1 --always
          haxelib install hxcpp-debug-server --always
          haxelib install tjson 1.4.0 --always
          haxelib install hscript-iris 1.1.3 --always
          haxelib install hxvlc 2.0.1 --skip-dependencies --always
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit 1906c4a96f6bb6df66562b3f24c62f4c5bba14a7
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp.git ceb70d040f0792f004ccf1ed7eb6fcea01d7f3ff
          haxelib list | tee installed-haxelibs.txt

      - name: Configure Lime
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime display -project mobile-source/Project.xml android > lime-display.txt 2>&1 || true

      - name: Compile Android debug APK
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd mobile-source
          haxelib run lime build android -debug > ../android-compile.log 2>&1 || {
            tail -100 ../android-compile.log
            exit 1
          }
          find export -name '*.apk' -type f | tee ../apks-found.txt
          test -s ../apks-found.txt

      - name: Upload compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megamix-android-baseline-logs
          path: |
            source-commit.txt
            installed-haxelibs.txt
            lime-display.txt
            android-compile.log
            apks-found.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK only if freshly compiled
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: megamix-android-baseline-apk
          path: mobile-source/export/**/*.apk
          if-no-files-found: error
          retention-days: 7
